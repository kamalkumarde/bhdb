# --- Zookeeper Infrastructure ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper
  namespace: bhdb-data-platform
spec:
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      containers:
      - name: zookeeper
        image: confluentinc/cp-zookeeper:7.5.3
        ports:
        - containerPort: 2181
        env:
        - name: ZOOKEEPER_CLIENT_PORT
          value: "2181"
---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper-service
  namespace: bhdb-data-platform
spec:
  selector:
    app: zookeeper
  ports:
    - port: 2181
      targetPort: 2181
---
# --- Kafka Infrastructure ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: bhdb-data-platform
spec:
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
      - name: kafka
        image: confluentinc/cp-kafka:7.5.3
        ports:
        - containerPort: 9092
        env:
        - name: KAFKA_BROKER_ID
          value: "1"
        - name: KAFKA_ZOOKEEPER_CONNECT
          value: "zookeeper-service:2181"
        - name: KAFKA_LISTENERS
          value: "PLAINTEXT://0.0.0.0:9092"
        - name: KAFKA_ADVERTISED_LISTENERS
          value: "PLAINTEXT://kafka-service:9092"
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-service
  namespace: bhdb-data-platform
spec:
  selector:
    app: kafka
  ports:
    - port: 9092
      targetPort: 9092
---
# --- Your Custom Engine Deployments ---
# (Producer, Extract, Transform, Load, Consumer)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-producer
  namespace: bhdb-data-platform
spec:
  selector:
    matchLabels:
      app: producer
  template:
    metadata:
      labels:
        app: producer
    spec:
      containers:
      - name: runtime
        image: local-producer:v1
        imagePullPolicy: Never
